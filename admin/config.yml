backend:
  name: git-gateway
  branch: claude/church-website-builder-LTHxX

media_folder: assets/img/uploads
public_folder: /assets/img/uploads
locale: es

# Cada colección se guarda como JSON para que assets/js/contenido.js
# pueda consumir los archivos directamente sin parsear YAML frontmatter.
# contenido.js descubre los archivos automáticamente vía GitHub Contents
# API — el equipo NO tiene que mantener ningún manifiesto manual.
#
# Todos los campos *_en son OPCIONALES: si el pastor solo escribe en
# español, la web cae a la versión ES automáticamente vía
# texto(item, campo) en contenido.js.
collections:

  - name: cumpleanos
    label: "🎂 Cumpleaños"
    folder: data/cumpleanos
    create: true
    extension: json
    format: json
    slug: "{{fields.nombre}}-{{fields.mes}}"
    fields:
      - { label: "Nombre completo", name: nombre, widget: string }
      - { label: "Día y mes (ej: 15 de enero)", name: fecha, widget: string }
      - { label: "Mes (número 1-12)", name: mes, widget: number,
          value_type: int, min: 1, max: 12,
          hint: "1=Enero, 2=Febrero… 12=Diciembre. Define el filtro automático del mes actual." }
      - { label: "Foto (opcional)", name: foto, widget: image, required: false,
          media_folder: /assets/img/uploads, public_folder: /assets/img/uploads }
      - { label: "Activo", name: activo, widget: boolean, default: true }

  - name: oracion
    label: "🙏 Necesidades de Oración"
    folder: data/oracion
    create: true
    extension: json
    format: json
    slug: "{{slug}}"
    summary: "{{fields.necesidad_es | truncate(80)}}"
    fields:
      - { label: "Necesidad", name: necesidad_es, widget: text }
      - { label: "Need in English (optional)", name: necesidad_en, widget: text, required: false }
      - { label: "Activo", name: activo, widget: boolean, default: true }

  - name: anuncios
    label: "📢 Anuncios y Eventos"
    folder: data/anuncios
    create: true
    extension: json
    format: json
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: titulo_es, widget: string }
      - { label: "Title in English (optional)", name: titulo_en, widget: string, required: false }
      - { label: "Descripción", name: descripcion_es, widget: text }
      - { label: "Description in English (optional)", name: descripcion_en, widget: text, required: false }
      - label: "Tipo"
        name: tipo
        widget: select
        options:
          - { label: Semanal, value: semanal }
          - { label: Mensual, value: mensual }
          - { label: Evento especial, value: evento }
      - { label: "Fecha", name: fecha, widget: datetime, format: YYYY-MM-DD }
      - { label: "Imagen (opcional)", name: imagen, widget: image, required: false,
          media_folder: /assets/img/uploads, public_folder: /assets/img/uploads }
      - { label: "Activo", name: activo, widget: boolean, default: true }

  - name: lectura
    label: "📖 Versículo de la Semana"
    folder: data/lectura
    create: true
    extension: json
    format: json
    slug: "{{slug}}"
    fields:
      - { label: "Versículo", name: versiculo_es, widget: text }
      - { label: "Verse in English (optional)", name: versiculo_en, widget: text, required: false }
      - { label: "Referencia (ej: Juan 3:16)", name: referencia, widget: string }
      - { label: "Reflexión (opcional)", name: reflexion_es, widget: text, required: false }
      - { label: "Reflection in English (optional)", name: reflexion_en, widget: text, required: false }
      - { label: "Activo", name: activo, widget: boolean, default: true }
