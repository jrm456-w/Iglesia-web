backend:
  name: git-gateway
  branch: main

media_folder: assets/img/uploads
public_folder: /assets/img/uploads
locale: es

# Cada colección se guarda como JSON para que assets/js/contenido.js
# pueda consumir los archivos directamente sin parsear YAML frontmatter.
# contenido.js descubre los archivos automáticamente vía GitHub Contents
# API — el equipo NO tiene que mantener ningún manifiesto manual.
collections:

  - name: cumpleanos
    label: "🎂 Cumpleaños"
    folder: data/cumpleanos
    extension: json
    format: json
    create: true
    slug: "{{fields.nombre}}"
    fields:
      - { label: Nombre completo, name: nombre, widget: string }
      - { label: "Día y mes (ej: 15 de enero)", name: fecha, widget: string }
      - { label: Mes número (1-12), name: mes, widget: number,
          hint: "Para filtrar automáticamente el mes actual",
          value_type: int, min: 1, max: 12 }
      - { label: Foto (opcional), name: foto, widget: image, required: false }
      - { label: Activo, name: activo, widget: boolean, default: true }

  - name: oracion
    label: "🙏 Necesidades de Oración"
    folder: data/oracion
    extension: json
    format: json
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{hour}}{{minute}}"
    fields:
      - { label: Necesidad (español), name: necesidad_es, widget: text }
      - { label: Need (English), name: necesidad_en, widget: text }
      - { label: Activo, name: activo, widget: boolean, default: true }

  - name: anuncios
    label: "📢 Anuncios y Eventos"
    folder: data/anuncios
    extension: json
    format: json
    create: true
    slug: "{{fields.fecha}}-{{fields.titulo_es}}"
    fields:
      - { label: Título (español), name: titulo_es, widget: string }
      - { label: Title (English), name: titulo_en, widget: string }
      - { label: Descripción (español), name: descripcion_es, widget: text }
      - { label: Description (English), name: descripcion_en, widget: text }
      - label: Tipo
        name: tipo
        widget: select
        options:
          - { label: Semanal, value: semanal }
          - { label: Mensual, value: mensual }
          - { label: Evento especial, value: evento }
      - { label: Fecha, name: fecha, widget: datetime, format: YYYY-MM-DD }
      - { label: Imagen (opcional), name: imagen, widget: image, required: false }
      - { label: Activo, name: activo, widget: boolean, default: true }

  - name: lectura
    label: "📖 Lectura de la Semana"
    folder: data/lectura
    extension: json
    format: json
    create: true
    slug: "{{year}}-{{month}}-{{day}}"
    fields:
      - { label: Versículo (español), name: versiculo_es, widget: text }
      - { label: Verse (English), name: versiculo_en, widget: text }
      - { label: Referencia, name: referencia, widget: string,
          hint: "Ejemplo: Juan 3:16" }
      - { label: Reflexión (español), name: reflexion_es, widget: text }
      - { label: Reflection (English), name: reflexion_en, widget: text }
      - { label: Activo, name: activo, widget: boolean, default: true }
